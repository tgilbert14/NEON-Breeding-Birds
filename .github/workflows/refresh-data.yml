name: Propose immutable NEON breeding-bird refresh

# Producer -> independent validator -> restricted publisher. Network bytes are
# written only to empty staging, then handed to a clean checkout. Only the final
# job can write, and it can publish a review branch — never master.

on:
  schedule:
    # Monthly at 23:00 on the first day in America/Phoenix (Arizona has no DST).
    - cron: "0 6 2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breeding-birds-release-refresh
  cancel-in-progress: false

env:
  RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  BRD_LIVE: "0"
  BIRD_RELEASE: RELEASE-2026

jobs:
  # Fails the run, named, when the NEON token is missing or rejected; the fetch
  # needs it, and every other path still turns red on a bad token.
  probe_token:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Probe a NEON data endpoint with the token
        shell: bash
        env:
          NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
          PROBE_URL: https://data.neonscience.org/api/v0/data/DP1.10003.001/SRER/2023-05
        run: |
          # Shared NEON-suite token probe. Keep this block byte-identical in every repo;
          # only PROBE_URL differs. NEON data endpoints refuse anonymous requests, so a
          # missing or rejected token fails here, named, before any download starts.
          set -euo pipefail
          if [ -z "${NEON_TOKEN:-}" ]; then
            echo "::error title=Missing NEON token::Set the NEON_TOKEN repository secret; NEON data endpoints refuse anonymous requests."
            echo "NEON token probe: the NEON_TOKEN secret is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS --retry 3 --retry-all-errors --max-time 60 -o "$body" -w '%{http_code}' \
            -H "X-API-Token: $NEON_TOKEN" "$PROBE_URL") || code=000
          files=$(jq -r '.data.files | length' "$body" 2>/dev/null) || files=0
          rm -f "$body"
          if [ "$code" != "200" ] || ! [ "$files" -ge 1 ] 2>/dev/null; then
            echo "::error title=NEON token rejected::HTTP $code with $files files from $PROBE_URL; check or rotate the NEON_TOKEN secret."
            echo "NEON token probe: HTTP $code, $files files from $PROBE_URL." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "NEON token probe: HTTP 200, $files files from $PROBE_URL." | tee -a "$GITHUB_STEP_SUMMARY"

  # Watches NEON's anonymous product metadata for a release newer than the one
  # this app is pinned to (RELEASE-2027 is expected in late January). It never
  # changes the pinned build: it only raises a named warning and a summary line
  # so a person can plan the re-pin.
  release_watch:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Look for a NEON release newer than the pinned one
        shell: bash
        env:
          PRODUCT_URL: https://data.neonscience.org/api/v0/products/DP1.10003.001
        run: |
          set -euo pipefail
          body=$(mktemp)
          code=$(curl -sS --retry 3 --retry-all-errors --max-time 60 -o "$body" -w '%{http_code}' \
            "$PRODUCT_URL") || code=000
          if [ "$code" != "200" ]; then
            echo "::warning title=Release watch unavailable::HTTP $code from $PRODUCT_URL; the pinned $BIRD_RELEASE build continues."
            echo "Release watch: HTTP $code from NEON product metadata; could not check for a newer release." >> "$GITHUB_STEP_SUMMARY"
            rm -f "$body"
            exit 0
          fi
          releases=$(jq -r '[.data.releases[]?.release // empty] | map(select(test("^RELEASE-[0-9]{4}$"))) | sort | join(" ")' "$body" 2>/dev/null) || releases=""
          rm -f "$body"
          if [ -z "$releases" ]; then
            echo "::warning title=Release watch unavailable::NEON product metadata listed no parsable release; the pinned $BIRD_RELEASE build continues."
            echo "Release watch: no parsable release list in NEON product metadata; could not check for a newer release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pinned_year=${BIRD_RELEASE#RELEASE-}
          newer=""
          for r in $releases; do
            if [ "${r#RELEASE-}" -gt "$pinned_year" ]; then newer="$newer $r"; fi
          done
          if [ -n "$newer" ]; then
            echo "::warning title=Newer NEON release available::DP1.10003.001 now lists${newer}; this app is pinned to $BIRD_RELEASE. Re-pin deliberately (release, DOI, roster, receipts), never by editing data."
            echo "Release watch: NEON lists${newer}, newer than the pinned $BIRD_RELEASE. Plan a re-pin." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release watch: newest listed release is ${releases##* }; pinned $BIRD_RELEASE is current." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  produce_candidate:
    needs: probe_token
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
      BIRD_ENV_BATCH_SIZE: "4"
    steps:
      - name: Checkout immutable producer revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set job-local producer paths
        run: |
          echo "BIRD_RAW_DIR=$RUNNER_TEMP/bird-raw" >> "$GITHUB_ENV"
          echo "BIRD_RECEIPT=$RUNNER_TEMP/bird-source-receipt.json" >> "$GITHUB_ENV"
          echo "BIRD_OUTPUT_ROOT=$RUNNER_TEMP/bird-candidate" >> "$GITHUB_ENV"
          echo "BIRD_ENV_RECEIPT=$RUNNER_TEMP/bird-candidate/data/environment_source_receipt.json" >> "$GITHUB_ENV"
          echo "BIRD_ENV_EVIDENCE_DIR=$RUNNER_TEMP/environment-evidence" >> "$GITHUB_ENV"

      - name: Set up pinned R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.2"
          use-public-rspm: false

      - name: Bootstrap checksum-pinned pak
        run: bash scripts/install_pinned_pak.sh

      - name: Install producer dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: neonUtilities@4.0.2, dplyr, tidyr, stringr, tibble, jsonlite, digest
          pak-version: none
          dependencies: '"hard"'
          cache-version: breeding-birds-producer-pak-0.11.1-neonutilities-4.0.2-v3
          install-pandoc: "false"
          install-quarto: "false"

      - name: Reverify reviewed pak bootstrap
        run: |
          Rscript --vanilla -e 'lib <- normalizePath(Sys.getenv("R_LIB_FOR_PAK"), mustWork = TRUE); actual <- as.character(packageVersion("pak", lib.loc = lib)); stopifnot(identical(actual, "0.11.1"), identical(normalizePath(find.package("pak"), mustWork = TRUE), normalizePath(file.path(lib, "pak"), mustWork = TRUE)))'

      - name: Run opportunity fixtures before network fetch
        run: |
          Rscript --vanilla scripts/test_helpers.R
          Rscript --vanilla scripts/test_bird_evidence_privacy.R
          Rscript --vanilla scripts/test_env_batching.R

      - name: Require release token
        run: |
          if [[ -z "${NEON_TOKEN:-}" ]]; then
            echo "::error title=Missing NEON token::A full 47-site release fetch requires NEON_TOKEN."
            exit 1
          fi

      - name: Fetch and bundle exact release in empty staging
        run: |
          set -euo pipefail
          mkdir -p "$BIRD_RAW_DIR" "$BIRD_OUTPUT_ROOT"
          Rscript --vanilla scripts/fetch_bird_all.R
          Rscript --vanilla scripts/bundle_bird_data.R
          Rscript --vanilla scripts/sanitize_bird_evidence.R
          Rscript --vanilla scripts/scan_bird_evidence.R
          env_private="$RUNNER_TEMP/bird-environment-private"
          mkdir -m 700 "$env_private"
          cleanup_environment_private() {
            if [[ -d "$env_private" ]]; then
              find "$env_private" -mindepth 1 -delete
              rmdir "$env_private"
            fi
          }
          trap cleanup_environment_private EXIT
          df -h "$RUNNER_TEMP"
          /usr/bin/time -v -o "$RUNNER_TEMP/environment-refresh-time.txt" \
            env TMPDIR="$env_private" Rscript --vanilla scripts/refresh_env_data.R
          cat "$RUNNER_TEMP/environment-refresh-time.txt"
          cleanup_environment_private
          trap - EXIT

      - name: Package exact source candidate
        run: |
          set -euo pipefail
          export BIRD_CANDIDATE_ROOT="$BIRD_OUTPUT_ROOT"
          test ! -e "$RUNNER_TEMP/bird-environment-private"
          Rscript --vanilla -e 'source("R/site_metadata.R"); root <- Sys.getenv("BIRD_CANDIDATE_ROOT"); expected <- sort(as.character(neon_sites$site)); stopifnot(length(expected) == 47L, "PUUM" %in% expected); for (rel in c("data/sites", "data/env")) { dir <- file.path(root, rel); got <- sort(sub("[.]rds$", "", basename(list.files(dir, pattern="[.]rds$")))); stopifnot(identical(got, expected)) }; required <- c("data/site_index.rds", "data/source_receipt.json", "data/environment_source_receipt.json", "data/bundle_schema.json", "data-sample/demo.rds"); for (rel in required) { path <- file.path(root, rel); stopifnot(file.exists(path), file.info(path)$size > 0) }'
          git diff --check
          tar -C "$BIRD_OUTPUT_ROOT" -czf "$RUNNER_TEMP/breeding-birds-produced-2026.tgz" data data-sample
          tar -C "$BIRD_RAW_DIR" -czf "$RUNNER_TEMP/breeding-birds-raw-evidence-2026.tgz" .
          tar -C "$BIRD_ENV_EVIDENCE_DIR" -czf "$RUNNER_TEMP/breeding-birds-env-evidence-2026.tgz" .

      - name: Upload immutable producer candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: breeding-birds-produced-2026-${{ github.sha }}
          path: ${{ runner.temp }}/breeding-birds-produced-2026.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Upload immutable raw validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: breeding-birds-raw-evidence-2026-${{ github.sha }}
          path: ${{ runner.temp }}/breeding-birds-raw-evidence-2026.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Upload immutable environmental validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: breeding-birds-env-evidence-2026-${{ github.sha }}
          path: ${{ runner.temp }}/breeding-birds-env-evidence-2026.tgz
          if-no-files-found: error
          retention-days: 3

  validate_candidate:
    needs: produce_candidate
    if: needs.produce_candidate.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable validator revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set job-local validator paths
        run: |
          echo "BIRD_RAW_DIR=$RUNNER_TEMP/raw-evidence" >> "$GITHUB_ENV"
          echo "BIRD_ENV_EVIDENCE_DIR=$RUNNER_TEMP/environment-evidence" >> "$GITHUB_ENV"

      - name: Set up pinned R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.2"
          use-public-rspm: false

      - name: Bootstrap checksum-pinned pak
        run: bash scripts/install_pinned_pak.sh

      - name: Install validator and runtime dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: >
            shiny, bslib@0.11.0, bsicons, dplyr, tidyr, stringr, tibble,
            plotly@4.12.0, leaflet, DT, shinyjs, shinycssloaders, RColorBrewer,
            htmltools, jsonlite, digest, rsconnect, cpp11,
            url::https://cran.r-project.org/src/contrib/Archive/terra/terra_1.8-50.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sf_1.1-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/s2_1.1.11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/units_1.0-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/wk_0.9.5.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/classInt_0.4-11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/raster_3.6-32.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sp_2.2-1.tar.gz
          pak-version: none
          dependencies: '"hard"'
          cache-version: breeding-birds-validator-geo-pak-0.11.1-bslib-0.11.0-v3
          install-pandoc: "false"
          install-quarto: "false"

      - name: Reverify reviewed pak bootstrap
        run: |
          Rscript --vanilla -e 'lib <- normalizePath(Sys.getenv("R_LIB_FOR_PAK"), mustWork = TRUE); actual <- as.character(packageVersion("pak", lib.loc = lib)); stopifnot(identical(actual, "0.11.1"), identical(normalizePath(find.package("pak"), mustWork = TRUE), normalizePath(file.path(lib, "pak"), mustWork = TRUE)))'

      - name: Verify deterministic numeric runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes
          lib = ctypes.CDLL("libopenblas.so.0")
          lib.openblas_get_corename.restype = ctypes.c_char_p
          core = lib.openblas_get_corename().decode("ascii")
          threads = lib.openblas_get_num_threads()
          print(f"OpenBLAS core={core} threads={threads}")
          if core.lower() != "haswell" or threads != 1:
              raise SystemExit("unexpected OpenBLAS runtime")
          PY

      - name: Download immutable producer candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: breeding-birds-produced-2026-${{ github.sha }}
          path: ${{ runner.temp }}/candidate

      - name: Download immutable raw evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: breeding-birds-raw-evidence-2026-${{ github.sha }}
          path: ${{ runner.temp }}/raw-artifact

      - name: Download immutable environmental evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: breeding-birds-env-evidence-2026-${{ github.sha }}
          path: ${{ runner.temp }}/env-artifact

      - name: Materialize candidate in clean validator checkout
        run: |
          set -euo pipefail
          find data data-sample -mindepth 1 -delete
          tar -xzf "$RUNNER_TEMP/candidate/breeding-birds-produced-2026.tgz"
          mkdir -p "$BIRD_RAW_DIR" "$BIRD_ENV_EVIDENCE_DIR"
          tar -C "$BIRD_RAW_DIR" -xzf "$RUNNER_TEMP/raw-artifact/breeding-birds-raw-evidence-2026.tgz"
          tar -C "$BIRD_ENV_EVIDENCE_DIR" -xzf "$RUNNER_TEMP/env-artifact/breeding-birds-env-evidence-2026.tgz"

      - name: Independently reconcile raw visits and detections
        run: |
          set -euo pipefail
          test -f scripts/verify_raw_candidate.R || {
            echo "::error title=Missing raw release oracle::scripts/verify_raw_candidate.R is required"
            exit 1
          }
          Rscript --vanilla scripts/verify_raw_candidate.R

      - name: Independently reconstruct environmental context
        run: |
          set -euo pipefail
          test -f scripts/verify_env_candidate.R || {
            echo "::error title=Missing environment oracle::scripts/verify_env_candidate.R is required"
            exit 1
          }
          Rscript --vanilla scripts/verify_env_candidate.R

      - name: Independently rebuild every derived index
        run: |
          set -euo pipefail
          rebuild() {
            Rscript --vanilla scripts/build_site_index.R
            Rscript --vanilla scripts/refresh_site_climate.R
            Rscript --vanilla scripts/build_cross_site.R
            Rscript --vanilla scripts/build_search_index.R
          }
          derived=(
            data/site_index.rds data/site_climate.rds data/site_month_clim.rds
            data/cross_site.rds data/search_index.rds
          )
          rebuild
          for path in "${derived[@]}"; do test -s "$path"; done
          sha256sum "${derived[@]}" > "$RUNNER_TEMP/breeding-birds-derived.sha256"
          rebuild
          sha256sum --check "$RUNNER_TEMP/breeding-birds-derived.sha256"

      - name: Generate and independently verify exact candidate
        run: |
          set -euo pipefail
          test -f scripts/verify_bundle.R || {
            echo "::error title=Missing release gate::scripts/verify_bundle.R is required"
            exit 1
          }
          BIRD_MANIFEST_PHASE=prestamp Rscript --vanilla scripts/write_manifest.R
          BIRD_RELEASE_STAMP_MODE=write BIRD_WRITE_PAGES_RELEASE=1 \
            Rscript --vanilla scripts/write_release_stamp.R
          BIRD_MANIFEST_PHASE=final Rscript --vanilla scripts/write_manifest.R
          BIRD_RELEASE_STAMP_MODE=verify BIRD_WRITE_PAGES_RELEASE=1 \
            Rscript --vanilla scripts/write_release_stamp.R
          Rscript --vanilla scripts/test_helpers.R
          Rscript --vanilla scripts/test_bird_evidence_privacy.R
          Rscript --vanilla scripts/test_env_helpers.R
          Rscript --vanilla scripts/test_env_batching.R
          Rscript --vanilla scripts/test_env_batch_producer_parity.R
          Rscript --vanilla scripts/test_verify_env_candidate.R
          Rscript --vanilla scripts/test_release_stamp.R
          Rscript --vanilla scripts/verify_bundle.R
          Rscript --vanilla scripts/verify_manifest.R
          Rscript --vanilla -e 'Sys.setenv(BRD_LIVE="0"); source("global.R"); source("ui.R"); candidate <- source("server.R")$value; stopifnot(inherits(ui,"shiny.tag.list") || inherits(ui,"shiny.tag"), is.function(candidate))'
          Rscript --vanilla scripts/test_server_runtime.R
          node --check www/app.js
          node --check www/pincards.js
          bash -n scripts/post_deploy_smoke.sh
          git diff --check

      - name: Package immutable validated candidate
        run: tar -czf "$RUNNER_TEMP/breeding-birds-release-2026.tgz" data data-sample docs/release.json manifest.json

      - name: Upload validated candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: breeding-birds-release-2026-${{ github.sha }}
          path: ${{ runner.temp }}/breeding-birds-release-2026.tgz
          if-no-files-found: error
          retention-days: 7

  publish_candidate:
    needs: validate_candidate
    if: needs.validate_candidate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout validated producer revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download exact validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: breeding-birds-release-2026-${{ github.sha }}
          path: ${{ runner.temp }}/candidate

      - name: Publish review branch, never master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor origin/master "$GITHUB_SHA"; then
            echo "Producer revision does not contain current master; refusing stale publication."
            exit 1
          fi
          find data data-sample -mindepth 1 -delete
          tar -xzf "$RUNNER_TEMP/candidate/breeding-birds-release-2026.tgz"
          branch="automation/breeding-birds-release-2026"
          remote_head=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
          git switch -C "$branch"
          git config user.name "neon-data-bot"
          git config user.email "neon-data-bot@users.noreply.github.com"
          git add -A -- data data-sample docs/release.json manifest.json
          if git diff --cached --quiet -- data data-sample docs/release.json manifest.json; then
            echo "No validated candidate change, including untracked scoped files."
            exit 0
          fi
          git commit -m "data: propose validated breeding-bird RELEASE-2026 [bot]" \
            -m "Exact 47-site opportunity-complete candidate produced from ${GITHUB_SHA}."
          published_commit=$(git rev-parse HEAD)
          if [[ "$(git rev-parse HEAD^)" != "$GITHUB_SHA" ]]; then
            echo "Candidate promotion commit is not a direct child of the validated producer revision."
            exit 1
          fi
          if [[ -n "$remote_head" ]]; then
            git push --force-with-lease="refs/heads/$branch:$remote_head" \
              origin "$branch:refs/heads/$branch"
          else
            git push origin "$branch:refs/heads/$branch"
          fi
          pushed_commit=""
          for attempt in 1 2 3 4 5; do
            pushed_commit=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
            [[ "$pushed_commit" == "$published_commit" ]] && break
            sleep 2
          done
          if [[ "$pushed_commit" != "$published_commit" ]]; then
            echo "Published branch does not resolve to the validated candidate commit."
            exit 1
          fi

          pr_count=$(gh pr list --head "$branch" --base master --state open \
            --json url --jq 'length')
          if (( pr_count > 1 )); then
            echo "More than one open master PR exists for $branch; refusing ambiguous publication."
            exit 1
          fi
          if (( pr_count == 0 )); then
            echo "::notice title=Validated review branch ready::Open a reviewer-authenticated PR from $branch to master after reviewing run ${GITHUB_RUN_ID}; that PR event is the exact-head CI trigger."
            exit 0
          fi

          pr_record=""
          for attempt in 1 2 3 4 5; do
            pr_record=$(gh pr list --head "$branch" --base master --state open \
              --json url,baseRefName,headRefName,headRefOid \
              --jq 'if length == 1 then .[0] | [.url,.baseRefName,.headRefName,.headRefOid] | @tsv else "" end')
            [[ "$pr_record" == *$'\t'"$published_commit" ]] && break
            sleep 2
          done
          IFS=$'\t' read -r pr_url pr_base pr_head pr_oid <<< "$pr_record"
          if [[ -z "$pr_record" || "$pr_base" != master || "$pr_head" != "$branch" || \
                "$pr_oid" != "$published_commit" ]]; then
            echo "Open PR identity does not match master <- $branch at $published_commit."
            exit 1
          fi
          gh pr comment "$pr_url" \
            --body "Updated from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. GitHub will hold the pull_request synchronize checks triggered by this automation update for approval; a repository write user must select **Approve workflows to run**. Do not merge until checks are green on exact head ${published_commit}."
          echo "::notice title=Approve exact-head PR checks::Existing PR updated to $published_commit. A repository write user must select Approve workflows to run, then verify green checks on that exact head."
